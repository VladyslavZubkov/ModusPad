name: Bug report
description: Something in ModusPad doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModusPad version
      description: Menu bar icon › About ModusPad
      placeholder: "1.0 (4)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
